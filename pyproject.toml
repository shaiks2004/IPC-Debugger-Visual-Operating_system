[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipc-debugger-visual-operating-system"
version = "0.1.0"
description = "Secure IPC visualization, simulation, replay, and benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0.0",
  "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ipc-debugger = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
